# Omadora default Alacritty config. Managed by chezmoi; run `omadora-setup` to
# re-apply it. Colors come from Noctalia, which renders the file imported below
# whenever the theme changes (switch with `omadora-theme-set`).

[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]

[window]
padding = { x = 8, y = 8 }

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
